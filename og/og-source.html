<!doctype html>
<!-- Source of public/og/premavision.jpg (1200x630). Render:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --disable-gpu \
       --hide-scrollbars --window-size=1200,630 --screenshot=og/og.png og/og-source.html
     then convert to JPEG (scripts in DEPLOY.md). Images are read from ../public. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=Inter+Tight:wght@600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;overflow:hidden;background:#050B24}
  body{font-family:Manrope,-apple-system,system-ui,sans-serif;color:#fff;position:relative}
  .bg{position:absolute;inset:0;background:url(../public/img/hero-blueprint.webp) right center/cover no-repeat;opacity:.55}
  .fade{position:absolute;inset:0;background:linear-gradient(90deg,#050B24 0%,rgba(5,11,36,.94) 48%,rgba(5,11,36,.35) 100%)}
  .grid{position:absolute;inset:0;background-image:linear-gradient(to right,rgba(144,216,240,.05) 1px,transparent 1px),linear-gradient(to bottom,rgba(144,216,240,.05) 1px,transparent 1px);background-size:32px 32px}
  .wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 72px}
  .copy{max-width:760px}
  .brand{display:flex;align-items:center;gap:14px;font-weight:800;font-size:28px;letter-spacing:-.02em}
  .brand img{width:52px;height:52px}
  h1{margin-top:34px;font-family:'Inter Tight',sans-serif;font-size:56px;line-height:1.06;font-weight:600;letter-spacing:-.035em}
  h1 em{font-style:normal;background:linear-gradient(100deg,#ffffff,#c9ecfa 45%,#7fcdef);-webkit-background-clip:text;background-clip:text;color:transparent}
  .meta{margin-top:30px;font-size:24px;color:#94a3b8;font-weight:500}
  .meta b{color:#e2e8f0;font-weight:600}
  .people{display:flex;gap:-20px}
  .people img{width:150px;height:150px;border-radius:50%;object-fit:cover;object-position:top;border:3px solid rgba(255,200,30,.85);box-shadow:0 0 40px rgba(0,168,240,.45)}
  .people img+img{margin-left:-28px;border-color:rgba(0,168,240,.9)}
</style></head>
<body>
  <div class="bg"></div><div class="fade"></div><div class="grid"></div>
  <div class="wrap">
    <div class="copy">
      <div class="brand"><img src="../public/logo-512.png" alt="">Prema Vision</div>
      <h1>AI systems for companies.<br><em>Built and taken to production.</em></h1>
      <p class="meta"><b>Fixed price, taken to production</b> · premavision.net</p>
    </div>
    <div class="people"><img src="../public/img/denys-korolkov.webp" alt=""><img src="../public/img/victoria-von.webp" alt=""></div>
  </div>
</body></html>
