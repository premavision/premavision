<!doctype html>
<!-- Source of og/facebook-profile.png (1080x1080, Facebook Page profile picture).
     Facebook crops it to a circle, so the logo sits inside the middle 72%. Render with
     --window-size=1080,1080 (see og/facebook-cover.html for the full command). -->
<html><head><meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1080px;height:1080px;overflow:hidden;background:#050B24}
  body{display:flex;align-items:center;justify-content:center;
       background:radial-gradient(circle at 50% 50%,rgba(0,168,240,.22) 0%,rgba(5,11,36,0) 55%),#050B24}
  img{width:760px;height:760px}
</style></head>
<body><img src="../public/logo-512.png" alt=""></body></html>
