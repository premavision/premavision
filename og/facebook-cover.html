<!doctype html>
<!-- Source of og/facebook-cover.png (1640x624, Facebook Page cover). Render:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --disable-gpu \
       --hide-scrollbars --force-device-scale-factor=1 --window-size=1640,624 --virtual-time-budget=5000 \
       --screenshot=og/facebook-cover.png "file://$PWD/og/facebook-cover.html"
     Safe zone: phones show only the middle 16:9 (about x 265 to 1375), so everything
     that matters sits in x 330 to 1340. On desktop the profile picture sits below the
     cover on the left; the creation wizard's preview with a centred circle is not what
     visitors see. -->
<html><head><meta charset="utf-8">
<style>
  @font-face{font-family:Manrope;src:url(../public/fonts/manrope-latin.woff2) format('woff2');font-weight:400 800}
  @font-face{font-family:'Inter Tight';src:url(../public/fonts/inter-tight-latin.woff2) format('woff2');font-weight:400 800}
  *{box-sizing:border-box;margin:0}
  html,body{width:1640px;height:624px;overflow:hidden;background:#050B24}
  body{font-family:Manrope,-apple-system,system-ui,sans-serif;color:#fff;position:relative}
  .grid{position:absolute;inset:0;background-image:linear-gradient(to right,rgba(144,216,240,.05) 1px,transparent 1px),linear-gradient(to bottom,rgba(144,216,240,.05) 1px,transparent 1px);background-size:32px 32px}
  /* hero art scaled to the cover height (1110x624); its diagram ends near x 1360 */
  .art{position:absolute;top:0;left:310px;width:1110px;height:624px;background:url(../public/img/hero-blueprint.webp) center/cover no-repeat;
       -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 20%,#000 92%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0%,#000 20%,#000 92%,transparent 100%)}
  .fade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,11,36,0) 0%,rgba(5,11,36,.92) 22%,rgba(5,11,36,.8) 46%,rgba(5,11,36,0) 62%)}
  .copy{position:absolute;left:330px;top:128px;width:600px}
  .brand{display:flex;align-items:center;gap:14px;font-weight:800;font-size:26px;letter-spacing:-.02em}
  .brand img{width:46px;height:46px}
  h1{margin-top:26px;font-family:'Inter Tight',sans-serif;font-size:46px;line-height:1.08;font-weight:600;letter-spacing:-.035em}
  h1 em{font-style:normal;background:linear-gradient(100deg,#ffffff,#c9ecfa 45%,#7fcdef);-webkit-background-clip:text;background-clip:text;color:transparent}
  .meta{margin-top:24px;font-size:21px;color:#94a3b8;font-weight:500}
  .meta b{color:#e2e8f0;font-weight:600}
</style></head>
<body>
  <div class="grid"></div><div class="art"></div><div class="fade"></div>
  <div class="copy">
    <div class="brand"><img src="../public/logo-512.png" alt="">Prema Vision</div>
    <h1>AI systems for companies.<br><em>Built and taken to production.</em></h1>
    <p class="meta"><b>premavision.net</b> · Palm Coast, Florida</p>
  </div>
</body></html>
